<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Arquivos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wallpaper-container">
    <div class="wallpaper-image" style="background-image: url(.../Sky.jpg);"></div>
  </div>
  <div class="bg-box">
    <h1>Envio de Arquivos</h1>
    <form id="uploadForm">
      <input type="file" id="fileInput" required />
      <button type="submit" style="margin-top: 16px;">Enviar</button>
    </form>
    <p id="response"></p>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      const formData = new FormData();
      formData.append('file', file);

      const response = await fetch('https://api.file.io/', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      document.getElementById('response').textContent = `Link do arquivo: ${data.link}`;
    });
  </script>
</body>
</html>
