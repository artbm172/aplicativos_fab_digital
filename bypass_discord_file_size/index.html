<html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Arquivos</title>
  <link rel="stylesheet" href="style.css">
<style type="text/css" id="operaUserStyle"></style><style type="text/css"></style></head>
<body>
  <div class="wallpaper-container">
    <div class="wallpaper-image" style="background-image: url(https://artbm172.github.io/aplicativos_fab_digital/Sky.jpg);"></div>
  </div>
  <div class="bg-box">
    <h1>Envio de Arquivos</h1><input type="text" id="username" placeholder="Usuário" required="" class="visual">
      <input type="password" id="password" placeholder="Senha" required="" class="visual" style="margin-top: 4px;">
    
    <form id="uploadForm">
      <input type="file" id="fileInput" required="">
      <button type="submit" style="margin-top: 16px;">Enviar</button>
    </form>
    <p id="response"></p>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      const formData = new FormData();
      formData.append('file', file);

      const response = await fetch('https://api.file.io/', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      document.getElementById('response').textContent = `Link do arquivo: ${data.link}`;
    });
  </script>
